# Pre-installs tools/dependencies into the Copilot coding agent's ephemeral
# environment BEFORE it starts a task. The job MUST be named
# `copilot-setup-steps` or GitHub will not pick it up.
#
# Only these keys are honored inside the job: steps, permissions, runs-on,
# container, services, snapshot, timeout-minutes (max 59). Everything else is
# ignored. Keep permissions minimal — these are the permissions for the SETUP
# job, not for the agent itself.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Poetry
        run: python -m pip install "poetry==2.2.1"

      - name: Install dependencies
        run: poetry install --with dev --no-interaction
